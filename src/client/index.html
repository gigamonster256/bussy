<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Notifier</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/app.js"></script>
</head>
<body>
    <header>
        <h1>Aggie Spirit Bus Notifier</h1>
    </header>
    
    <main>
        <section id="setup">
            <h2>Subscribe to Alerts</h2>
            <form id="subscribe-form">
                <div class="form-group">
                    <label for="route-select">Route</label>
                    <select id="route-select" required>
                        <option value="">Loading routes...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="direction-select">Direction</label>
                    <select id="direction-select" disabled required>
                        <option value="">Select a route first</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="stop-select">Stop</label>
                    <select id="stop-select" disabled required>
                        <option value="">Select a direction first</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="notify-minutes">Notify me</label>
                    <input type="number" id="notify-minutes" value="10" min="1" max="60">
                    <span>minutes before arrival</span>
                </div>

                <button type="submit" id="subscribe-btn" disabled>Start Tracking</button>
            </form>
        </section>

        <section id="alerts" class="hidden">
            <h2>Active Alerts</h2>
            <div id="alerts-container">
                <!-- Alert cards will go here -->
            </div>
            <div id="log" class="log-container"></div>
        </section>
    </main>
</body>
</html>
